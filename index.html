<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game-container">
        <h1>Tic Tac Toe</h1>

        <form id="playerForm">
            <div>
                <label for="playerOneName">Player 1 (X)</label>
                <input type="text" id="playerOneName" name="playerOneName" required>
            </div>

            <div>
                <label for="playerTwoName">Player 2 (O)</label>
                <input type="text" id="playerTwoName" name="playerTwoName" required>
            </div>

            <button type="submit" id="startButton">Start Game</button>
        </form>

        <p id="gameStatus" aria-live="polite">Enter player names to start.</p>

        <section class="scoreboard" aria-label="Player scores">
            <div class="player-card player-card--x" id="playerOneCard">
                <span class="player-mark" aria-hidden="true">X</span>
                <div>
                    <span class="player-label">Player 1</span>
                    <strong id="playerOneScore">Waiting</strong>
                </div>
            </div>
            <div class="player-card player-card--o" id="playerTwoCard">
                <span class="player-mark" aria-hidden="true">O</span>
                <div>
                    <span class="player-label">Player 2</span>
                    <strong id="playerTwoScore">Waiting</strong>
                </div>
            </div>
        </section>

        <div class="board" id="board" aria-label="Tic Tac Toe board">
            <button class="cell" type="button" data-index="0" aria-label="Cell 1"></button>
            <button class="cell" type="button" data-index="1" aria-label="Cell 2"></button>
            <button class="cell" type="button" data-index="2" aria-label="Cell 3"></button>
            <button class="cell" type="button" data-index="3" aria-label="Cell 4"></button>
            <button class="cell" type="button" data-index="4" aria-label="Cell 5"></button>
            <button class="cell" type="button" data-index="5" aria-label="Cell 6"></button>
            <button class="cell" type="button" data-index="6" aria-label="Cell 7"></button>
            <button class="cell" type="button" data-index="7" aria-label="Cell 8"></button>
            <button class="cell" type="button" data-index="8" aria-label="Cell 9"></button>
        </div>

        <button type="button" id="resetButton">Restart Game</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
